<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub PR Creation Mock</title>
</head>
<body>
    <h1>GitHub PR Creation Mock Page</h1>
    <form>
        <label for="pr-title">Title:</label>
        <input type="text" id="pr-title" name="pr-title"><br><br>

        <label for="pr-description">Description:</label><br>
        <textarea id="pr-description" name="pr-description" rows="4" cols="50"></textarea><br><br>

        <button type="submit">Create PR</button>
    </form>
</body>
</html>
